services:
  - type: web
    name: promptforge-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements-external.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: promptforge
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://prompts.renderedge.life
